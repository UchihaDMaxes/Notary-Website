{% extends "base.html" %}
{% block title %}{{ t('settings') }}{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1 class="page-title">{{ t('settings') }}</h1>
    <p class="page-sub">{{ current_user.full_name }} &middot; @{{ current_user.username }}</p>
  </div>
</div>

<div class="form-grid" style="max-width:860px;align-items:start;">
  <!-- Profile -->
  <div class="card">
    <div class="card-head"><span class="card-title">{{ t('profile') }}</span></div>
    <form method="post" class="card-body">
      <input type="hidden" name="form" value="profile" />
      <div class="field mb-3">
        <label class="label" for="full_name">{{ t('full_name') }}</label>
        <input class="input" id="full_name" name="full_name" type="text" value="{{ current_user.full_name }}" required />
      </div>
      <div class="field mb-3">
        <label class="label" for="username">{{ t('username') }}</label>
        <input class="input" id="username" type="text" value="{{ current_user.username }}" disabled />
      </div>
      <div class="field mb-4">
        <label class="label" for="language">{{ t('language') }}</label>
        <select class="select" id="language" name="language">
          {% for code, name in LANGUAGES.items() %}
            <option value="{{ code }}" {{ 'selected' if current_user.language == code }}>{{ name }}</option>
          {% endfor %}
        </select>
      </div>
      <button class="btn btn-primary">{{ t('update_profile') }}</button>
    </form>
  </div>

  <!-- Password -->
  <div class="card">
    <div class="card-head"><span class="card-title">{{ t('change_password') }}</span></div>
    <form method="post" class="card-body">
      <input type="hidden" name="form" value="password" />
      <div class="field mb-3">
        <label class="label" for="current_password">{{ t('current_password') }}</label>
        <input class="input" id="current_password" name="current_password" type="password" required />
      </div>
      <div class="field mb-3">
        <label class="label" for="new_password">{{ t('new_password') }}</label>
        <input class="input" id="new_password" name="new_password" type="password" required />
      </div>
      <div class="field mb-4">
        <label class="label" for="confirm_password">{{ t('confirm_password') }}</label>
        <input class="input" id="confirm_password" name="confirm_password" type="password" required />
      </div>
      <button class="btn btn-primary">{{ t('save_changes') }}</button>
    </form>
  </div>
</div>
{% endblock %}
