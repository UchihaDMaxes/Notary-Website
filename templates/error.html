{% extends "base.html" %}
{% block title %}{{ t('error') }} {{ code }}{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:40px auto;">
  <div class="card-body-lg text-center">
    <div class="stat-value" style="font-size:40px;color:#b45309;">{{ code }}</div>
    <p class="muted mt-2">{{ message }}</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-4">{{ t('dashboard') }}</a>
  </div>
</div>
{% endblock %}
