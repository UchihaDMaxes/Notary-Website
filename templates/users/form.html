{% extends "base.html" %}
{% block title %}{{ t('edit_user') if user else t('create_user') }}{% endblock %}

{% block content %}
<div style="max-width:560px;">
  <div class="page-head">
    <div>
      <a href="{{ url_for('users.list') }}" class="card-link">&larr; {{ t('back') }}</a>
      <h1 class="page-title mt-2">{{ t('edit_user') if user else t('create_user') }}</h1>
    </div>
  </div>

  <form method="post" class="card">
    <div class="card-body-lg">
      <div class="field mb-3">
        <label class="label" for="full_name">{{ t('full_name') }} <span class="req">*</span></label>
        <input class="input" id="full_name" name="full_name" type="text" required value="{{ user.full_name if user else '' }}" />
      </div>
      <div class="field mb-3">
        <label class="label" for="username">{{ t('username') }} <span class="req">*</span></label>
        <input class="input" id="username" name="username" type="text" required value="{{ user.username if user else '' }}" />
      </div>
      <div class="field mb-3">
        <label class="label" for="password">{{ t('password') }} {% if not user %}<span class="req">*</span>{% endif %}</label>
        <input class="input" id="password" name="password" type="password" {{ 'required' if not user }} />
        {% if user %}<p class="hint">{{ t('password_optional') }}</p>{% endif %}
      </div>

      <div class="form-grid mb-3">
        <div class="field">
          <label class="label" for="role">{{ t('role') }}</label>
          <select class="select" id="role" name="role">
            <option value="staff" {{ 'selected' if user and user.role == 'staff' }}>{{ t('staff') }}</option>
            <option value="admin" {{ 'selected' if user and user.role == 'admin' }}>{{ t('admin') }}</option>
          </select>
        </div>
        <div class="field">
          <label class="label" for="language">{{ t('language') }}</label>
          <select class="select" id="language" name="language">
            {% for code, name in LANGUAGES.items() %}
              <option value="{{ code }}" {{ 'selected' if user and user.language == code }}>{{ name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <label class="check-row mb-4">
        <input type="checkbox" name="active" {{ 'checked' if not user or user.active }} /> {{ t('active') }}
      </label>

      <div class="divider"></div>
      <div class="flex gap-2">
        <button type="submit" class="btn btn-primary">{{ t('save') }}</button>
        <a href="{{ url_for('users.list') }}" class="btn btn-outline">{{ t('cancel') }}</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
